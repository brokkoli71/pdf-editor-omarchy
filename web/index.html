<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sidemark — browser prototype</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="src/style.css">
</head>
<body>

<header class="headerbar">
  <div class="hb-start">
    <button class="flat icon-btn" id="sidebar-btn" title="Show pages and outline" aria-label="Toggle sidebar">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 3v10" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button class="flat icon-btn" id="open-btn" title="Open a PDF — select its .md notes alongside it (or drop both anywhere)" aria-label="Open">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12.5v-9A.5.5 0 0 1 2.5 3h3.2l1.4 1.6h6.4a.5.5 0 0 1 .5.5v7.4a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button class="flat icon-btn" id="save-btn" title="Save (Ctrl+S)" aria-label="Save">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.2L13.5 5.8V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.5 2.5v3.2h5V2.5M5 13.5V9.8h6v3.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <span class="title" id="doc-title">Untitled</span>
  </div>

  <div class="hb-center">
    <div class="linked" id="toolbar"></div>
    <!-- The pen's colour, where you can see it and reach it — the desktop puts
         a filled dot right in the bar rather than only inside the popover. -->
    <button class="swatch-btn" id="pen-swatch" title="Pen colour" aria-label="Pen colour"></button>
  </div>

  <div class="hb-end">
    <div class="pager" id="pager">
      <button class="flat icon-btn" id="prev-page" title="Previous page" aria-label="Previous page">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="page-counter" id="page-counter">—</span>
      <button class="flat icon-btn" id="next-page" title="Next page" aria-label="Next page">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="pager" id="presenting" hidden>
      <button class="flat icon-btn" id="timer-toggle" title="Pause / resume the timer" aria-label="Pause or resume the timer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4v8M10 4v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="page-counter" id="timer">0:00</span>
      <button class="flat icon-btn" id="timer-reset" title="Reset the timer to 0:00" aria-label="Reset the timer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8a4.8 4.8 0 1 0 1.6-3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.6 3.2v2.6h2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button class="flat icon-btn" id="notes-btn" title="Show or hide the notes (Ctrl+\ · right-click to open a notes file)" aria-label="Toggle notes" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 3v10" stroke="currentColor" stroke-width="1.4"/><path d="M11 6h2M11 8.5h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <button class="flat icon-btn" id="present-btn" title="Presenter mode — mirror this page to a second screen" aria-label="Presenter mode">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.6" width="12.4" height="8.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 13.6h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="flat icon-btn" id="undo-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7h6.5a3.5 3.5 0 1 1 0 7H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.5 4.2 2.8 7l2.7 2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="flat icon-btn" id="redo-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 7H6.5a3.5 3.5 0 1 0 0 7H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.5 4.2 13.2 7l-2.7 2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="flat icon-btn" id="pen-btn" title="Pen settings" aria-label="Pen settings" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.6 2.6a1.4 1.4 0 0 1 2 2L6.2 12 3 13l1-3.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button class="flat icon-btn" id="more-btn" title="More" aria-label="More" aria-haspopup="menu">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- The verbs that are reached rather than reflexed.
     What stays in the bar is what a hand in the middle of writing reaches for:
     the page, the notes, undo, the pen. Everything here has a keyboard
     shortcut, a gesture or a place in the sidebar as well — this is the second
     way to it, not the only one. Each row IS the button it always was, id and
     wiring unchanged, so nothing is duplicated to drift. -->
<div class="popover menu-popover" id="more-popover" role="menu" aria-label="More" hidden>
  <div class="popover-body">
    <button class="flat menu-item" id="recent-btn" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Recent documents
    </button>
    <!-- NEW DOCUMENT and ADD PAGE live here because their shortcuts cannot.
         Ctrl+N and Ctrl+Shift+N are reserved by the browser for its own window
         and never reach a page, so a verb that exists only on those keys is a
         verb nobody in a browser has. -->
    <button class="flat menu-item" id="new-btn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.2L13.5 5.8V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.4v4M6 8.4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      New document
    </button>
    <button class="flat menu-item" id="add-page-btn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2.5" width="10" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5.6v5M5.5 8.1h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Add a blank page after this one
    </button>
    <button class="flat menu-item danger" id="del-page-btn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2.5" width="10" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 8.1h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Delete this page
    </button>
    <button class="flat menu-item" id="insert-btn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12.5 6v6M9.5 9h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Insert pages from a PDF…
    </button>
    <button class="flat menu-item" id="bookmark-btn" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.4l-3.6 1.9.7-4L2.2 6.5l4-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      Bookmark this page
      <span class="menu-key">Ctrl+B</span>
    </button>
    <a class="flat menu-item" href="demo.html" id="tour-link">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4.9" r=".85" fill="currentColor"/></svg>
      Take the tour
    </a>
    <div class="menu-sep"></div>
    <button class="flat menu-item" id="zoom-in">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      Zoom in
    </button>
    <button class="flat menu-item" id="zoom-out">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      Zoom out
    </button>
  </div>
</div>

<!-- Above BOTH modes on purpose: a search bar living inside the page column is
     unreachable the moment the notes take the window, and the handler runs
     while revealing something nobody can see. -->
<div class="searchbar" id="searchbar" hidden>
  <input type="search" id="search-entry" placeholder="Find in document" aria-label="Find in document">
  <span class="search-count" id="search-count"></span>
  <button class="flat icon-btn" id="search-prev" title="Previous match (Shift+Enter)" aria-label="Previous match">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="flat icon-btn" id="search-next" title="Next match (Enter)" aria-label="Next match">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="flat icon-btn" id="search-close" title="Close (Esc)" aria-label="Close search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</div>

<main id="body">
  <aside id="sidebar" hidden>
    <div class="linked side-switch" id="side-switch" hidden>
      <button id="side-pages" class="selected">Pages</button>
      <button id="side-outline">Outline</button>
    </div>
    <label class="check side-bookmarks" id="side-bookmarks-row" hidden>
      <input type="checkbox" id="side-bookmarks" checked> Bookmarks
    </label>
    <div id="side-list"></div>
  </aside>
  <div id="paned">
    <div id="stage">
      <canvas id="page" aria-label="Drawing page"></canvas>
      <div class="drop-hint" id="drop-hint" hidden>
        <strong id="drop-title">Drop to open</strong>
        <span id="drop-sub">A PDF and its .md notes open together — several PDFs merge into one document, a chapter each</span>
      </div>
    </div>
    <div id="divider" role="separator" aria-label="Resize notes" tabindex="0"></div>
    <div id="notes-col">
      <div class="notes-header" id="notes-header">
        <label class="check" id="link-check-row" title="Continue this page's notes from the page before it. One tick carries the run on through every following page that has nothing of its own.">
          <input type="checkbox" id="link-check"> Continues previous page
        </label>
      </div>
      <div id="notes"></div>
    </div>
  </div>
</main>

<input type="file" id="insert-input" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="notes-input" accept=".md,text/markdown" hidden>
<input type="file" id="file-input" accept="application/pdf,.pdf,.md,text/markdown" multiple hidden>

<!-- the pen popover: the same rows as Sidemark's, minus "Predict ahead" —
     prediction was settled by grading and is deliberately not ported -->
<div class="popover" id="pen-popover" role="dialog" aria-label="Pen settings" hidden>
  <div class="popover-body">
    <div class="linked" id="popover-toolbar"></div>

    <label class="dim" for="width-scale">Width</label>
    <div class="scale-row">
      <input type="range" id="width-scale" min="0.3" max="5" step="0.1">
      <output id="width-out"></output>
    </div>

    <div class="row">
      <span class="dim grow">Color</span>
      <input type="color" id="color-btn" aria-label="Pen colour">
    </div>
    <div class="swatches" id="swatches"></div>

    <label class="dim" for="smooth-scale">Smoothing</label>
    <div class="scale-row" title="How much freehand strokes are smoothed when you lift the pen">
      <input type="range" id="smooth-scale" min="0" max="100" step="5">
      <output id="smooth-out"></output>
    </div>

    <label class="dim" for="smear-scale">Smear trim</label>
    <div class="scale-row" title="Cut the light smear a pen leaves as it lifts, so letters end cleanly instead of trailing into the next one. Only the END of a stroke is trimmed — the start is already clipped by the screen itself, and trimming that too would lose real ink.">
      <input type="range" id="smear-scale" min="0" max="50" step="5">
      <output id="smear-out"></output>
    </div>

    <label class="check" title="Recover the start of a stroke from where the pen was hovering just before it touched down, which the screen tracks anyway. These are real positions, not a guess.">
      <input type="checkbox" id="hover-lead"> Lead-in from hover
    </label>

    <label class="check" title="Shape the line as you draw it, instead of only when you lift the pen. Off, the line never moves once drawn but re-forms on release; on, it is already the line you will keep, at the cost of the last stretch re-settling on each point the pen reports.">
      <input type="checkbox" id="live-smooth"> Smooth while drawing
    </label>

    <label class="dim" for="shape-snap">Shape snap</label>
    <select id="shape-snap" title="What holding still mid-stroke snaps to">
      <option value="off">Off</option>
      <option value="lines">Lines only</option>
      <option value="shapes">Shapes &amp; grids</option>
    </select>

    <hr>

    <div class="row">
      <span class="dim grow" id="bindings-label">Buttons</span>
      <button class="flat small" id="reset-bindings">Reset</button>
    </div>
    <p class="hint">Click a tool with the button you want it on.</p>
    <div id="bindings-list"></div>
  </div>
</div>

<!-- Naming IS the add: nothing touches the model until Enter, so Escape leaves
     the page unmarked and the file not even dirty. -->
<div class="popover name-popover" id="bookmark-popover" role="dialog" aria-label="Name bookmark" hidden>
  <div class="popover-body">
    <label class="dim" for="bookmark-name">Bookmark name</label>
    <input type="text" id="bookmark-name" autocomplete="off">
    <div class="row">
      <span class="grow"></span>
      <button class="flat small" id="bookmark-cancel">Cancel</button>
      <button class="small suggested" id="bookmark-ok">Save</button>
    </div>
  </div>
</div>

<div class="popover recent-popover" id="recent-popover" role="dialog" aria-label="Recent documents" hidden>
  <div class="popover-body">
    <div class="row">
      <span class="dim grow">Recent documents</span>
      <button class="flat small" id="recent-clear">Clear</button>
    </div>
    <div id="recent-list"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
